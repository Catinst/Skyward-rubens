name: Build

# This fork builds only rubens, from the supplied unmodified OS1 image.
# Other device configurations remain for reference and upstream tests.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      device:
        description: Device to build (this fork supports rubens)
        required: false
        default: "rubens"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # A release goes by its tag to whoever downloads it, and a build by the
  # version built into it, which is what it holds against the newest
  # release's tag when it looks for an update: a tag naming another
  # version than the one built would have every phone find an update in
  # the very build it runs. Such a tag publishes nothing.
  tag:
    name: Check that the tag names the version built
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Hold the tag against the workspace's version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, and the workspace builds version $version"
            exit 1
          fi

  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint what runs on the computer
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Lint what runs on the phone
        run: cargo ndk -t arm64-v8a --platform 30 clippy --locked --workspace --all-targets -- -D warnings

  tools:
    name: Build the recovery service and the packer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the recovery service for the phone
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward
      # Times the frames the pages draw, on the phone itself: the same
      # example the UI crate keeps for a computer's benchmark, built for the
      # phone so the recovery's own hardware says what a frame costs.
      - name: Build the frames benchmark for the phone
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward-ui --example frames
      # It runs as a second system's first program, before any library is
      # there to load.
      - name: Build the second system's first program, static
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward-system-init --target-dir target/system-init
      - name: Build the packer
        run: cargo build --locked --release -p skyward-pack
      - name: Gather them
        run: |
          mkdir tools
          cp target/aarch64-linux-android/release/skyward target/release/skyward-pack tools/
          cp target/aarch64-linux-android/release/examples/frames tools/
          cp target/system-init/aarch64-linux-android/release/system-init tools/
      - uses: actions/upload-artifact@v7
        with:
          name: tools
          path: tools/
          if-no-files-found: error
          retention-days: 1

  devices:
    name: List the devices
    runs-on: ubuntu-24.04
    outputs:
      devices: ${{ steps.list.outputs.devices }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        env:
          DEVICE: ${{ inputs.device || 'rubens' }}
        run: |
          test "$DEVICE" = rubens
          test -f "devices/$DEVICE.toml"
          echo "devices=$(jq -nc --arg device "$DEVICE" '[$device]')" >> "$GITHUB_OUTPUT"

  recovery:
    name: Recovery for ${{ matrix.device }}
    needs: [tools, devices]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.devices.outputs.devices) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tools
          path: tools
      - name: Make the tools runnable
        run: chmod +x tools/skyward tools/skyward-pack
      - name: Restore and verify the supplied OS1 vendor boot
        id: stock
        run: |
          mkdir -p stock
          xz -dc stock/rubens/vendor_boot.img.xz > stock/recovery.img
          echo '518f97f578fcc096c2eb54ba96e9bc7e37cee8d8b717bf0ae87f19bd3b814758  stock/recovery.img' | sha256sum --check
          echo 'version=OS1.0.14.0.ULNCNXM' >> "$GITHUB_OUTPUT"
      - name: Pack the recovery
        id: pack
        env:
          DEVICE: ${{ matrix.device }}
          STOCK: ${{ steps.stock.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="${GITHUB_SHA::7}"; fi
          name="skyward-$version-$DEVICE-$STOCK"
          mkdir out
          tools/skyward-pack recovery --stock stock/recovery.img --binary tools/skyward --system-init tools/system-init \
            --config "devices/$DEVICE.toml" --font resources/fonts/MiSansVF.ttf --mono resources/fonts/KirkMono-Regular.ttf \
            --mono-license resources/fonts/KirkMono-OFL.txt \
            --add /system/etc/init/skyward-servicemanager-override.rc=stock/rubens/skyward-servicemanager-override.rc \
            --out "out/$name.img"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Verify the packed image and unchanged original fstab
        env:
          IMAGE: out/${{ steps.pack.outputs.name }}.img
        run: |
          python3 scripts/verify-rubens-image.py stock/recovery.img "$IMAGE"
          for path in first_stage_ramdisk/fstab.mt6895 system/etc/recovery.fstab lib/modules/modules.load.recovery; do
            tools/skyward-pack cat stock/recovery.img "$path" > /tmp/original-entry
            tools/skyward-pack cat "$IMAGE" "$path" > /tmp/packed-entry
            cmp /tmp/original-entry /tmp/packed-entry
          done
          tools/skyward-pack cat "$IMAGE" system/bin/recovery > /tmp/packed-recovery
          cmp tools/skyward /tmp/packed-recovery
          tools/skyward-pack cat "$IMAGE" skyward/device.toml > /tmp/packed-device.toml
          cmp devices/rubens.toml /tmp/packed-device.toml
          tools/skyward-pack cat "$IMAGE" system/etc/init/skyward-servicemanager-override.rc > /tmp/packed-svc-override.rc
          cmp stock/rubens/skyward-servicemanager-override.rc /tmp/packed-svc-override.rc
      # The output is a full vendor_boot image. No device is flashed here.
      - name: Zip the image
        working-directory: out
        env:
          NAME: ${{ steps.pack.outputs.name }}
        run: zip -9 "$NAME.zip" "$NAME.img"
      # The artifact takes the zip's name.
      - uses: actions/upload-artifact@v7
        with:
          path: out/${{ steps.pack.outputs.name }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [tag, check, recovery]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The devices' configurations say which phone each zip is for.
      - uses: actions/checkout@v7
      # Each artifact is a zip, which the download keeps whole under its
      # name, as it is handed out.
      - uses: actions/download-artifact@v8
        with:
          pattern: skyward-*
          path: images
          merge-multiple: true
          skip-decompress: true
      - name: Sum the zips
        working-directory: images
        run: sha256sum -- *.zip > SHA256SUMS
      # Each zip shows on the release as the phone it is for, its model and
      # then its codename, which is how people look for theirs; a device
      # whose zip is missing stops the release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          zips=()
          for config in devices/rubens.toml; do
            device=$(basename "$config" .toml)
            model=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["device"]["model"])' "$config")
            zip=$(ls images/skyward-"$GITHUB_REF_NAME"-"$device"-*.zip)
            zips+=("$zip#$model ($device)")
          done
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "${zips[@]}" images/SHA256SUMS
