# Redmi K50 first build. Based on the owner's unmodified OS1 vendor_boot.
# ColorOS my_* fstab additions are intentionally excluded.
[device]
codename = "rubens"
brand = "Redmi"
model = "Redmi K50"
ab = true
soc = { hans = "天玑 8100", hant = "天璣 8100", en = "Dimensity 8100" }
os_version_prop = "ro.mi.os.version.incremental"
recovery_partition = "vendor_boot"
restart_service_directory = false
# Libraries the original recovery ramdisk lacks, copied to /system/lib64/
# at runtime by recovery_libraries::copy() during prepare(). They are
# sourced from the mounted super partitions (/mnt/system/system is where
# skyward_vab::mount_partitions mounts system_a), so they cost nothing on
# the initrd size or the 64 MiB combined-initrd limit.
#
# libbinder.so: the recovery ramdisk does not carry it. The VNDK31 APEX
#   copy is a vendor-side snapshot, while the system's servicemanager
#   binary imports its AIDL marshalling from libbinder; a call's header
#   names the copy of libbinder that laid it out and the receiver turns a
#   call away where the names differ, so the installed system's copy is
#   used and Skyward writes that copy's name (see parcel.rs).
# libbinder_ndk.so: the vendor's keymint, gatekeeperd and keystore2 load
#   it; the VNDK31 APEX carries no copy and the ramdisk has none.
# libc++.so: recovery ramdisk carries a stripped build missing vtables.
# libbase.so: recovery copy lacks fmt::v10::vformat needed by libvintf.
# libvndksupport.so / libvintf.so / android.hidl.token@1.0.so:
#   absent from the recovery ramdisk.
recovery_libraries = [
  "/mnt/system/system/lib64/libbinder.so",
  "/mnt/system/system/lib64/libbinder_ndk.so",
  "/mnt/system/system/lib64/libutils.so",
  "/mnt/system/system/lib64/libapexsupport.so",
  "/mnt/system/system/lib64/bootstrap/libdl_android.so",
  "/mnt/system/system/lib64/libc++.so",
  "/mnt/system/system/lib64/libvndksupport.so",
  "/mnt/system/system/lib64/libbase.so",
  "/mnt/system/system/lib64/libvintf.so",
  "/mnt/system/system/lib64/android.hidl.token@1.0.so",
]

[display]
# The lower of the panel's modes, which the vendor partition's build.prop
# starts the installed system in: persist.sys.miui_resolution = 1080,2400,420.
# The pages are drawn at that many pixels and the panel scales them to its
# own 1440 by 3200, so a frame is 43% of the work of one drawn at the
# panel's size; the light is kept at the same size to the eye by the density.
width = 1080
height = 2400
density = 420
diagonal = 6.67
fastest_refresh = false

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor"]
# Original modules.load.recovery already includes fts_touch_spi,
# xiaomi_touch and panel-l11a-38-0a-0a-dsc-cmd. Haptics is on vendor_dlkm.
# The WLAN's driver chain is loaded with the phone starting, as the phone's
# own init loads it: the assistant writes the chip's settings once its node
# is there, and the chip's loader finds its own node before the programs
# start.
load = ["haptic", "wlan_drv_gen4m_6895"]
# No unverified touchscreen sysfs writes.

[haptics]
resonance = "/sys/bus/i2c/drivers/awinic_haptic/1-005a/f0"
# The driver keeps ten waveforms of the phone's own, wf_0 to wf_9; the
# second is the stronger of the two clicks it keeps.
click = 1
strength = { lightest = 0.25, strongest = 1.0 }

[wlan]
# The driver's modules are loaded with the phone starting (see [modules]).
modules = []
# The chip's first switch-on calibrates and takes a minute; it is switched
# on while the phone starts, so that the page's switch finds the interface.
warm_up = true
nodes = [
  { user = "wifi", group = "wifi", mode = 0o660, paths = ["/dev/wmtWifi"] },
  { user = "system", group = "system", mode = 0o660, paths = ["/dev/conninfra_dev"] },
]
settings = { property = "vendor.mtk.nvram.ready", value = "1" }
writes = [{ path = "/dev/wmtWifi", value = "1" }]
attempts = 5
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/vendor/lib64/vndk", "/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant@1.4::ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# Local stock input and SHA-256 are documented in stock/rubens/README.md.
# No [stock] OTA URL: this build uses the supplied OS1 image, not the OS2 OTA.
[skyward]
releases = "Catinst/Skyward-rubens"

[update]
server = "https://update.miui.com/updates/miotaV3.php"

[partitions]
# nvdata holds the WLAN's own settings, which the assistant reads as the
# driver comes up; the driver's write tells the chip to start.
mounted = ["persist", "nvdata"]

[logd]
libraries = ["/mnt/system/system/lib64/libsysutils.so", "/mnt/system/system/lib64/libcap.so"]

# Confirmed against this phone's /vendor/etc/init/microtrust.rc.
[[service]]
path = "/vendor/bin/teei_daemon"
libraries = ["/system/lib64", "/vendor/lib64"]
args = [
  "-r", "020b0000000000000000000000000000",
  "-r", "020f0000000000000000000000000000",
  "-r", "06090000000000000000000000000000",
  "-r", "05120000000000000000000000000000",
  "-r", "40188311faf343488db888ad39496f9a",
  "-r", "07060000000000000000000000007169",
  "-r", "4be4f7dc1f2c11e5b5f7727283247c7f",
  "-r", "9073f03a9618383bb1856eb3f990babd",
  "-r", "08050000000000000000000000003419",
  "-r", "5020170115e016302017012521300000",
  "-r", "0f5eed3c3b5a47afacca69a84bf0efad",
  "-r", "07407000000000000000000000000000",
  "-r", "05160000000000000000000000000000",
  "-r", "91dba524a6e24909acc48abd7163121a",
  "-r", "08070000000000000000000000008270",
  "-r", "09080000000000000000000000009381",
  "-t", "08030000000000000000000000000000",
  "-t", "85f630e0f0964c5fa2cc268ce04e3da3",
  "-t", "98fb95bcb4bf42d26473eae48690d7ea",
  "-t", "7b66512021214487ba710a51d7ea78fe",
  "-t", "09010000000000000000000000000000",
]
user = "system"
groups = ["system"]
capabilities = ["SYS_RAWIO"]

[[service]]
path = "/vendor/bin/hw/android.hardware.security.keymint@1.0-service.beanpod"
libraries = ["/system/lib64", "/vendor/lib64"]
user = "nobody"
groups = ["nobody"]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"
registers = [
  "android.hardware.security.keymint.IRemotelyProvisionedComponent/default",
  "android.hardware.security.secureclock.ISecureClock/default",
  "android.hardware.security.sharedsecret.ISharedSecret/default",
]

[[service]]
path = "/system/bin/hwservicemanager"
libraries = ["/system/lib64", "/vendor/lib64"]
user = "system"
groups = ["system", "readproc"]
ready_property = "hwservicemanager.ready"

[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper@1.0-service"
libraries = ["/system/lib64", "/vendor/lib64"]
user = "system"
groups = ["system"]
ready_hardware_service = "android.hardware.gatekeeper@1.0::IGatekeeper/default"

[[service]]
path = "/vendor/bin/hw/android.hardware.boot@1.2-service"
libraries = ["/system/lib64", "/vendor/lib64"]
user = "root"
groups = ["root"]
ready_hardware_service = "android.hardware.boot@1.2::IBootControl/default"

[[service]]
path = "/vendor/bin/conninfra_loader"
libraries = ["/system/lib64", "/vendor/lib64"]
user = "system"
groups = ["system"]
# The phone's own init_conninfra.rc runs it once, as the driver's node is
# there: it powers the connectivity part and writes the properties that
# say it is up. Run again it crashes, so it is not started again.
oneshot = true

[[service]]
path = "/vendor/bin/wlan_assistant"
libraries = ["/vendor/lib64/vndk", "/system/lib64", "/vendor/lib64"]
user = "wifi"
groups = ["system", "gps", "inet"]

[[owners]]
user = "system"
group = "system"
mode = 0o660
paths = ["/dev/teei_client", "/dev/teei_config", "/dev/tz_vfs"]

[[owners]]
user = "system"
group = "drmrpc"
mode = 0o660
paths = ["/dev/ut_keymaster"]

[[owners]]
user = "system"
group = "drmrpc"
mode = 0o666
paths = ["/dev/isee_tee0"]

[[owners]]
user = "system"
group = "system"
mode = 0o660
paths = ["/dev/0:0:0:49476", "/dev/rpmb0"]

# Made by the WLAN driver's chain as it loads with the phone starting, and
# opened by the assistant and the chip's loader under accounts of their own.
[[owners]]
user = "wifi"
group = "wifi"
mode = 0o660
paths = ["/dev/wmtWifi"]

[[owners]]
user = "system"
group = "system"
mode = 0o660
paths = ["/dev/conninfra_dev"]

[backup]
efs = ["nvdata", "nvcfg", "protect1", "protect2", "persist"]

[wipe]
logs = ["/data/vendor/mtklog", "/data/vendor/connsyslog"]
